[project]
name = "asvas-control-plane"
version = "0.1.0"
description = "ASVAS control plane (modular monolith): API, planning, policy, orchestration, evidence, reporting"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20",
    "cryptography>=46",
    "cvss>=3.4",
    "fastapi>=0.162",
    "grpcio>=1.85",
    "httpx>=0.28",
    "langgraph>=1.2",
    "langgraph-checkpoint-postgres>=3.2",
    "mcp==2.3.0",
    "neo4j>=6.0",
    "protobuf>=6.33",
    "psycopg[binary,pool]>=3.3",
    "pydantic>=2.14",
    "pydantic-settings>=2.6",
    "pyjwt>=2.15",
    "redis>=8.1",
    "reportlab>=4.2",
    "sqlalchemy>=2.1",
    "uvicorn[standard]>=0.54",
]

[project.scripts]
asvas = "asvas.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asvas", "asvasrpc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: needs the Go executor, OPA, PostgreSQL, Redis and the local test target"]

[tool.ruff]
extend-exclude = ["asvasrpc"]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["B008", "S101", "S608", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[dependency-groups]
dev = [
    "grpcio-tools>=1.85",
    "pytest>=9",
    "ruff>=0.8",
]
